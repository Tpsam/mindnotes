[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindnotes"
version = "0.1.0"
description = "A lightweight speech-to-knowledge pipeline running locally with sherpa-onnx and Notion sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "watchdog>=3.0.0",
    "notion-client>=2.2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "sherpa-onnx>=1.10.0; python_version < '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
mindnotes = "mindnotes.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mindnotes*"]
